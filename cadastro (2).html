<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen TV - Cadastro de Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SDKs do Firebase (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrp9JLmd9zBQzByPRBLCStLiLbH5z80Y",
            authDomain: "nextgentv.firebaseapp.com",
            projectId: "nextgentv",
            storageBucket: "nextgentv.firebasestorage.app",
            messagingSenderId: "999074190973",
            appId: "1:999074190973:web:967de16614c5274a760314"
        };

        // ===== Abre o player: app nativo quando possível, player web nos demais casos =====
        const URL_DOWNLOAD_APP = "https://cristianbesminoff-hue.github.io/NextGen.TV/"; // página onde o cliente baixa o APK (troque)

        function irParaPlayer() {
            const ua = navigator.userAgent;
            if (ua.includes('NextGenApp')) {
                // Dentro do app: abre o player nativo
                location.href = 'nextgen://player';
            } else if (/Android/i.test(ua)) {
                // Navegador do Android: tenta abrir o app; se não estiver instalado, vai para a página de download
                location.href = 'intent://player#Intent;scheme=nextgen;package=tv.nextgen.app;S.browser_fallback_url='
                    + encodeURIComponent(URL_DOWNLOAD_APP) + ';end';
            } else {
                // PC e iPhone: continua como antes, no player web
                window.location.href = 'player.html';
            }
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', () => {
            // Se o usuário já tiver cadastro salvo no navegador, manda direto para o player.html sem mostrar o form!
            if (localStorage.getItem('usuario_logado')) {
                irParaPlayer();
                return;
            }

            const inputTelefone = document.getElementById('telefone');
            const formCadastro = document.getElementById('formCadastro');
            const btnSubmit = document.getElementById('btnSubmit');

            // Máscara automática para o WhatsApp (Seu número configurado: 51989498171)
            inputTelefone.addEventListener('input', (e) => {
                let valor = e.target.value.replace(/\D/g, '');
                if (valor.length > 11) valor = valor.slice(0, 11);
                
                if (valor.length > 6) {
                    valor = `(${valor.slice(0,2)}) ${valor.slice(2,7)}-${valor.slice(7)}`;
                } else if (valor.length > 2) {
                    valor = `(${valor.slice(0,2)}) ${valor.slice(2)}`;
                } else if (valor.length > 0) {
                    valor = `(${valor}`;
                }
                e.target.value = valor;
            });

            formCadastro.addEventListener('submit', async (e) => {
                e.preventDefault();

                const telLimpo = inputTelefone.value.replace(/\D/g, '');
                if (telLimpo.length < 10) {
                    alert("Por favor, digite um número de WhatsApp válido com DDD.");
                    inputTelefone.focus();
                    return;
                }

                btnSubmit.disabled = true;
                btnSubmit.innerText = "A liberar acesso...";

                const dadosUsuario = {
                    nome: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    telefone: inputTelefone.value,
                    aceitePromocoes: true,
                    dataCadastro: new Date().toISOString()
                };

                try {
                    // Salva no Firebase na coleção 'clientes_leads'
                    await addDoc(collection(db, "clientes_leads"), dadosUsuario);

                    // Salva no localStorage para que ele nunca mais precise preencher o cadastro
                    localStorage.setItem('usuario_logado', JSON.stringify(dadosUsuario));

                    // Direciona direto para o player.html
                    irParaPlayer();
                } catch (error) {
                    console.error("Erro ao salvar no Firebase: ", error);
                    alert("Ocorreu um erro ao realizar o cadastro. Tente novamente.");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Aceder ao Player Agora";
                }
            });
        });
    </script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white">

    <div class="w-full max-w-md bg-zinc-950 border border-zinc-800 rounded-2xl shadow-2xl p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-extrabold text-blue-500">Liberar Player Grátis</h1>
            <p class="text-sm text-zinc-400">Preencha os seus dados para aceder imediatamente.</p>
        </div>

        <form id="formCadastro" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">O seu Nome</label>
                <input type="text" id="nome" required placeholder="Digite o seu nome completo" 
                    class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">E-mail (Sua Chave)</label>
                <input type="email" id="email" required placeholder="seu@email.com" 
                    class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">WhatsApp / Telefone</label>
                <input type="tel" id="telefone" required placeholder="(99) 99999-9999" maxlength="15"
                    class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div class="flex items-start space-x-3 pt-2">
                <input type="checkbox" id="aceiteTermos" required class="mt-1 h-4 w-4 rounded border-zinc-800 bg-black text-blue-600 focus:ring-blue-500">
                <label for="aceiteTermos" class="text-xs text-zinc-400 leading-relaxed">
                    Concordo em receber mensagens, promoções e novidades via WhatsApp e e-mail para ter acesso ao player.
                </label>
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition duration-200">
                Aceder ao Player Agora
            </button>
        </form>

    </div>

</body>
</html>
